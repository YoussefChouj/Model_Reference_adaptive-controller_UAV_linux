# Blacklist the kernel mcp2200 driver so the ATK-HS-V3-CMSIS-DAP probe's HID
# interface is captured by hid-generic instead. mcp2200 claims a misleading
# VID/PID match and intercepts the bridge's HID endpoints, breaking CMSIS-DAP
# over USB-HID on Linux. See:
#   https://jishuzhan.net/article/2050761299047546881
#   https://blog.csdn.net/2301_79618994/article/details/160716114
#
# Symptom: pyocd's CMSIS-DAP probe enumeration sees the device, attaches to
# it, and *can* read RAM (where the ATK Linux stack happens to succeed), but
# any flash erase/program is acknowledged without the bytes landing on the
# target. OpenOCD's bulk driver skips the HID interface entirely
# ("skipping interface 2, endpoint[0] is not bulk out").

blacklist hid_mcp2200
blacklist mcp2200
