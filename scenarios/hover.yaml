# Scenario name becomes part of the run-directory name.
name: hover
# Total simulated duration in seconds.
duration_s: 5.0
# Controller period in seconds: 200 Hz, with five 1 ms physics steps.
dt: 0.005
# Optional initial pose, velocity, rates, and motor thrusts.
initial_state:
  x: 0.0
  y: 0.0
  z: 0.0
  phi: 0.0
  theta: 0.0
  psi: 0.0
# Commands use total thrust in N and body-rate commands in rad/s.
# A z value of zero selects canonical hover thrust in the runner.
command:
  z: 0.0
  roll: 0.0
  pitch: 0.0
  yaw: 0.0
# Disturbances add to an axis command after start_s.
disturbances: []
# Predicates are checked after every deterministic simulator step.
stop_conditions:
  - max_abs_phi_deg: 30
# Seed is recorded in every reproducibility receipt.
seed: 42
