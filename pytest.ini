[pytest]
# Pins rootdir so `pytest` behaves the same from any CWD. Without this, rootdir was inferred
# per-invocation and bare `pytest` collected nothing useful.
testpaths =
    ground_station/flashtool/tests
    ground_station/build_budget/tests
    ground_station/livewatch/tests
    ground_station/gui/tests
    sim/tests
    flight_analysis/tests
    sil_gate/tests
