# GitHub Actions: Linux firmware build CI
#
# Mirrors the local `tasks.py build` flow on a hosted ubuntu-latest runner.
# Caches the arm-none-eabi-gcc toolchain via carlosperate/arm-none-eabi-gcc-action.
# Runs the project's regression tests for the Linux flash + build pipeline.
#
# This workflow does NOT touch physical hardware. The `flash` step is gated
# by hardware presence and is for self-hosted runners only (future work).
name: Linux firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: arm-none-eabi-gcc build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up arm-none-eabi-gcc 14.2.Rel1
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # pyocd is needed for the regression tests' pyocd import guard,
          # even though the actual flash path requires physical hardware.
          python -m pip install pyocd pytest

      - name: Build firmware (cmake)
        run: |
          cmake -B firmware/build -S firmware \
                -DCMAKE_TOOLCHAIN_FILE=firmware/cmake/arm-none-eabi-gcc.toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Debug
          cmake --build firmware/build --parallel 4

      - name: Verify build artifacts
        run: |
          test -f firmware/build/JX_FLY.elf
          test -f firmware/build/JX_FLY.hex
          test -f firmware/build/JX_FLY.bin
          test -f firmware/build/JX_FLY.map
          arm-none-eabi-size firmware/build/JX_FLY.elf

      - name: Verify vector table
        run: |
          # First 4 bytes of the vector table must be the SP value.
          # (Regression test for the .word __initial_sp bug.)
          arm-none-eabi-objcopy -O binary --only-section=.isr_vector \
              firmware/build/JX_FLY.elf /tmp/vt.bin
          SP=$(xxd -l 4 -e /tmp/vt.bin | awk '{print $2}')
          echo "Vector table SP word = $SP"
          # 0x2001d560 = __StackTop for this layout (1 KB stack, 192 KB SRAM)
          test "$SP" = "0x2001d560"

      - name: Run Linux-pipeline regression tests
        run: |
          .venv/bin/python -m pytest ground_station/flashtool_linux/tests/ -v

      - name: Run Python test suite (offline lanes)
        run: |
          .venv/bin/python -m pytest sim/tests/ -v --ignore=sim/tests/test_sindy_loader.py
